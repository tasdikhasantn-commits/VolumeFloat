name: Build VolumeFloat APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'VolumeFloat_APK_Build_Ready-v2.zip'
      - '.github/workflows/main.yml'
      - '.github/workflows/main.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract updated project
        run: |
          unzip -q VolumeFloat_APK_Build_Ready-v2.zip -d extracted
          test -f extracted/VolumeFloat/settings.gradle.kts

      - name: Build APK
        working-directory: extracted/VolumeFloat
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VolumeFloat-debug-apk
          path: extracted/VolumeFloat/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
