name: Build VolumeFloat APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'VolumeFloat_APK_Build_Ready.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q VolumeFloat_APK_Build_Ready.zip -d extracted
          find extracted -name settings.gradle.kts -print

      - name: Build APK
        run: |
          PROJECT=$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")
          cd "$PROJECT"
          gradle --version
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VolumeFloat-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
